[project]
name = "agentic-analyst"
version = "0.1.0"
description = "Multi-agent system for business research briefs"
readme = "README.md"
authors = [
    { name = "Georgios Theofilakos" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.14.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-core>=1.4.9",
    "langfuse>=4.14.0",
    "langgraph>=0.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "tavily-python>=0.7.26",
    "tenacity>=9.1.4",
    "trafilatura>=2.1.0",
]

[project.scripts]
agentic-analyst = "agentic_analyst.run:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

# --- Ruff (linter + formatter) ---
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"

# --- Mypy (type checker) ---
[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
"integration: tests that hit real external APIs",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "types-pyyaml>=6.0.12.20260724",
]
