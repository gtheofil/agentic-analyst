name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      # `evals` and `scripts` live outside src/ but are shipped code, and the
      # judge makes paid API calls. Leaving them unchecked is how the one module
      # nobody type-checks becomes the one that fails at 3am in CI.
      - name: Type check (mypy)
        run: uv run mypy src tests evals scripts

      - name: Test (pytest)
        run: uv run pytest
